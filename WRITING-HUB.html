<style>
:root{--ink:#0b1426;--navy:#101c36;--royal:#233f7a;--gold:#c9a84c;--gold2:#e6cf8f;--text:#e8edf7;--muted:#8ea2c8;}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:radial-gradient(1200px 500px at 50% -10%,#1d335f 0%,var(--navy) 45%,var(--ink) 100%);color:var(--text);font-family:'Noto Sans KR',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}
a{color:inherit;}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
.top-in{max-width:1080px;margin:0 auto;padding:18px 22px 0;}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.brand-nm{font-size:13px;font-weight:700;letter-spacing:.5px;color:#d9e2f3;}
.brand-nm i{font-style:normal;color:var(--gold);}
.brand-sub{font-size:11.5px;color:var(--muted);font-weight:300;margin-top:2px;}
.home{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#c9d4ea;text-decoration:none;border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:6px 12px;}
.home:hover{border-color:var(--gold);color:#fff;}
.hero{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;padding:30px 0 10px;}
.eyebrow{font-family:'Playfair Display',serif;font-style:italic;font-size:14px;color:var(--gold2);letter-spacing:1px;}
.hero h1{font-size:38px;font-weight:900;line-height:1.2;letter-spacing:-.5px;color:#fff;margin-top:6px;}
.hero h1 b{font-family:'Playfair Display',serif;font-weight:800;color:var(--gold);letter-spacing:2px;}
.hero p{margin-top:10px;font-size:13.5px;color:#aebbd8;font-weight:300;line-height:1.75;max-width:560px;}
.lockline{display:inline-block;margin-top:14px;font-size:12px;color:var(--gold2);border:1px solid rgba(201,168,76,.45);border-radius:999px;padding:5px 14px;}
.hero-side{text-align:right;padding-bottom:6px;}
.hero-side .big{font-family:'Playfair Display',serif;font-size:56px;font-weight:600;color:#fff;line-height:1;}
.hero-side .big small{font-family:'Noto Sans KR',sans-serif;font-size:14px;font-weight:500;color:#aebbd8;margin-left:4px;}
.hero-side .cap{font-size:12px;color:var(--muted);margin-top:6px;}
.jump{display:flex;gap:8px;margin:16px 0 4px;}
.jump a{text-decoration:none;font-size:12.5px;font-weight:700;color:#d9e2f3;border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:7px 16px;background:rgba(255,255,255,.05);}
.jump a:hover{border-color:var(--gold);color:var(--gold2);}

.main{max-width:1080px;margin:0 auto;padding:22px 22px 60px;}
.shelf{margin-top:30px;scroll-margin-top:16px;}
.sh{display:flex;align-items:baseline;gap:12px;margin-bottom:18px;}
.sh .tag{font-family:'Playfair Display',serif;font-size:12px;letter-spacing:4px;color:var(--gold);}
.sh h2{font-size:20px;font-weight:900;color:#fff;letter-spacing:-.3px;}
.sh .cnt{font-size:12px;color:var(--muted);margin-left:auto;}
.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 16px;align-items:start;padding:0 10px;}
.plank{height:14px;margin:0 -4px;border-radius:3px;background:linear-gradient(180deg,#3a2a14,#1c130a);box-shadow:0 14px 26px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.12);position:relative;}
.plank::after{content:'';position:absolute;left:4%;right:4%;top:-18px;height:18px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.35));pointer-events:none;}
.bk{display:block;text-decoration:none;text-align:center;padding-bottom:18px;position:relative;cursor:pointer;}
.cv{position:relative;width:118px;margin:0 auto;aspect-ratio:120/168;border-radius:5px 9px 9px 5px;overflow:hidden;background:#fff;box-shadow:-6px 10px 26px rgba(0,0,0,.55),inset 6px 0 10px -6px rgba(0,0,0,.45);transform:perspective(900px) rotateY(16deg);transform-origin:left center;transition:transform .3s,box-shadow .3s;}
.cv img,.cv svg{display:block;width:100%;height:100%;object-fit:cover;}
.cv::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,rgba(255,255,255,.35) 0%,rgba(255,255,255,0) 30%,rgba(0,0,0,.08) 70%,rgba(0,0,0,.28) 100%);pointer-events:none;}
.bk:hover .cv{transform:perspective(900px) rotateY(0deg) translateY(-10px) scale(1.04);box-shadow:0 22px 40px rgba(0,0,0,.6),0 0 0 2px rgba(201,168,76,.55),0 0 28px rgba(201,168,76,.35);}
.nm{margin-top:14px;font-size:13.5px;font-weight:800;color:#fff;line-height:1.35;}
.bk:hover .nm{color:var(--gold2);}

footer.maker{background:#070d1a;border-top:3px solid var(--gold);padding:30px 20px 26px;text-align:center;margin-top:10px;}
.maker .mk1{font-size:22px;font-weight:900;color:#fff;letter-spacing:5px;}
.maker .mk1 em{font-style:normal;color:var(--gold);}
.maker .mk-line{width:54px;height:2px;background:var(--gold);margin:12px auto;border-radius:2px;}
.maker .mk2{font-size:12.5px;color:#c8d8f0;font-weight:300;}
.maker .mk3{display:inline-block;margin-top:12px;font-size:10.5px;color:#e6cf8f;border:1px solid rgba(201,168,76,.45);border-radius:20px;padding:3px 14px;letter-spacing:.5px;}
.maker a{color:var(--gold);text-decoration:none;font-weight:700;}
@media(max-width:820px){
 .hero{grid-template-columns:1fr;} .hero-side{text-align:left;} .hero h1{font-size:28px;} .brand-sub{display:none;}
 .row{grid-template-columns:repeat(3,1fr);gap:18px 8px;padding:0 4px;} .cv{width:96px;} .nm{font-size:12.5px;}
 .maker .mk1{font-size:18px;letter-spacing:3px;}
}
@media(max-width:420px){ .row{grid-template-columns:repeat(2,1fr);} .cv{width:108px;} }
@media(prefers-reduced-motion:reduce){ .cv{transition:none;} }
</style>
