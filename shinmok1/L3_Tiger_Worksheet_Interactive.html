/* ============ 마크업 파서 ============ */
function esc(s) { return s; }

function md(s) {
  if (!s) return "";
  // 서식 먼저 처리 (빈칸 밑줄 문자와 충돌 방지)
  s = s.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  s = s.replace(/__([^_]+)__/g, "<u>$1</u>");
  s = s.replace(/\/\/([^/]+)\/\//g, "<i>$1</i>");
  s = s.replace(/~~([^~]+)~~/g, "<s>$1</s>");
  // 선택형  [[a|*b]]
  s = s.replace(/\[\[([^\]]+)\]\]/g, function (_, inner) {
    var ops = inner.split("|").map(function (o) {
      var cor = o.charAt(0) === "*";
      return "<span class='op" + (cor ? " cor" : "") + "'>" + (cor ? o.slice(1) : o) + "</span>";
    });
    return "<span class='ch'>[ " + ops.join(" / ") + " ]</span>";
  });
  // 빈칸  {{정답}} 또는 {{정답|placeholder}}
  s = s.replace(/\{\{([^}]+)\}\}/g, function (_, inner) {
    var parts = inner.split("|");
    var ans = parts[0];
    var ph = parts[1] || new Array(Math.max(6, Math.min(ans.length + 2, 20))).join("_");
    return "<span class='bl' data-ph='" + ph + "'>" + ans + "</span>";
  });
  return s;
}

/* ============ 조각 렌더러 ============ */
function piece(o) {
  if (o.t === "titlebox") return "<div class='titlebox'>" + md(o.s) + "</div>";
  if (o.t === "illus") return "<div class='illus'>[ 교과서 삽화 자리 ]</div>";
  if (o.t === "qbox") return "<div class='qbox'>" + md(o.s) + "</div>";
  if (o.t === "vocab") {
    var rows = "";
    var n = Math.max(o.a.length, o.b.length);
    for (var i = 0; i < n; i++) {
      rows += "<div>" + (o.a[i] || "") + "</div><div>" + (o.b[i] || "") + "</div>";
    }
    return "<div class='vocab'><div class='vt'><span>《주요 어휘》</span><span>" + o.p +
      "</span></div><div class='vl'>" + rows + "</div></div>";
  }
  if (o.t === "tfbox") {
    var h = "<div class='qbox'><div><b>Q. Write T for true or F for false.</b></div>";
    TF.forEach(function (t, i) {
      h += "<div style='margin-top:4px'>" + t.q +
        " <span class='bl' data-ph='__'>" + t.a + "</span>" +
        "<button class='exbtn' data-tf='" + i + "'>해설</button>" +
        "<div class='ex' id='tf" + i + "'><span class='tag'>T/F " + (i + 1) + "</span>" + t.exp + "</div></div>";
    });
    return h + "</div>";
  }
  return "";
}

function hintBox(hints) {
  if (!hints || !hints.length) return "";
  var h = "<div class='box'>";
  hints.forEach(function (x) {
    if (x.indexOf("★GP★") === 0) {
      h += "<div class='gp'>★ Grammar Point 1</div><div class='hl'>" + md(x.replace("★GP★", "")) + "</div>";
    } else if (x.indexOf("★GP2★") === 0) {
      h += "<div class='gp'>★ Grammar Point 2</div><div class='hl'>" + md(x.replace("★GP2★", "")) + "</div>";
    } else {
      h += "<div class='hl'>" + md(x) + "</div>";
    }
  });
  return h + "</div>";
}

/* ============ 페이지 렌더러 ============ */
var exSeq = 0;

function renderPage(p) {
  var h = "<div class='sheet'><div class='phead'>" +
    "<div class='l'>Lesson 3. Knowing Ourselves, Knowing Others</div>" +
    "<div class='r'>1학년 &nbsp; 반 &nbsp; 번 &nbsp; 이름: ____________</div></div>";

  if (p.kind === "full") {
    h += "<div style='padding:4px 6px'>";
    p.blocks.forEach(function (b) {
      if (b.t === "h1") h += "<h2 style='text-align:center;margin:6px 0 16px;font-size:19px'>" + b.s + "</h2>";
      else if (b.t === "h2") h += "<div style='font-weight:700;margin:16px 0 2px'>" + b.s + "</div>";
      else if (b.t === "h3") h += "<div style='font-weight:700;margin:10px 0 2px'>" + b.s + "</div>";
      else if (b.t === "p") h += "<div class='en' style='margin-bottom:4px'>" + md(b.s) + "</div>";
      else if (b.t === "ex") {
        var id = "ex" + (++exSeq);
        h += "<div><button class='exbtn' data-ex='" + id + "'>＋ 해설</button>" +
          "<div class='ex' id='" + id + "'><span class='tag'>" + b.tag + "</span>" + b.s + "</div></div>";
      }
    });
    h += "</div>";
  } else {
    h += "<div class='grid'>";
    if (p.top) {
      h += "<div class='cl'>" + (p.top.l || []).map(piece).join("") + "</div>";
      h += "<div class='cr'>" + (p.top.r || []).map(piece).join("") + "</div>";
    }
    p.rows.forEach(function (r) {
      var id = "ex" + (++exSeq);
      var L = "<div class='item'><div class='en'><span class='num'>" + r.num + ".</span> " +
        md(r.en) +
        (r.exp ? " <button class='exbtn' data-ex='" + id + "'>＋ 해설</button>" : "") + "</div>";
      if (r.sub) L += "<div style='font-size:12px;color:#333;padding-left:26px'>" + r.sub + "</div>";
      L += hintBox(r.hints);
      if (r.note) L += "<div style='font-size:12px;color:#C00000;margin:4px 0 0 10px'>" + r.note + "</div>";
      if (r.exp) L += "<div class='ex' id='" + id + "'><span class='tag'>" + r.num + "번 해설</span>" + r.exp + "</div>";
      L += (r.lextra || []).map(piece).join("");
      L += "</div>";

      var R = "<div class='kr'><span class='num'>" + r.num + ".</span> " + md(r.kr) + "</div>" +
        (r.rextra || []).map(piece).join("");

      h += "<div class='cl'>" + L + "</div><div class='cr'>" + R + "</div>";
    });
    h += "</div>";
  }

  h += "<div class='pfoot'>- " + p.n + " -</div></div>";
  return h;
}

})();
