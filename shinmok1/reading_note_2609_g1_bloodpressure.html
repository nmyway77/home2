/* ── v1.3 완성 노트 카드 ── */
.ncard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:26px 24px;margin-bottom:14px}

<script>

const D={"S": ["[Ⓐ] If you lined up all the blood vessels in your body, they'd be 95,000 kilometers long and everyday, they carry the equivalent of over 7,500 liters of blood, though that's actually the same four or five liters recycled over and over, delivering oxygen, and precious nutrients like glucose and amino acids to the body's tissues.", "[Ⓑ] All that blood exerts a force on the muscular walls of the blood vessels.", "That force is called blood pressure, and it rises and falls with the phases of the heartbeat.", "It's highest during systole, when the heart contracts to force blood through the arteries.", "This is your systolic blood pressure.", "When the heart is at rest between beats, blood pressure falls to its lowest value, the diastolic pressure.", "A typical healthy individual produces a systolic pressure between 90 and 120 millimeters of mercury, and diastolic pressure between 60 and 80.", "Taken together, a normal reading is a bit less than 120 over 80.", "[Ⓒ] The blood traverses the landscape of the body through the pipes of the circulatory system.", "In any plumbing system, several things can increase the force on the walls of the pipes: the properties of the fluid, extra fluid, or narrower pipes.", "So if the blood thickens, a higher pressure is needed to push it, so the heart will pump harder.", "A high-salt diet will lead to a similar result.", "The salt promotes water retention, and the extra fluid increases the blood volume and blood pressure, and stress, like the fight or flight response, releases hormones, like epinephrine and norepinephrine that constrict key vessels, increasing the resistance to flow and raising the pressure upstream.", "[Ⓓ] Blood vessels can usually handle these fluctuations easily.", "Elastic fibers embedded in their walls make them resilient, but if your blood pressure regularly rises above about 140 over 90, what we call hypertension, and stays there, it can cause serious problems.", "That's because the extra strain on the arterial wall can produce small tears.", "When the injured tissue swells up, substances that respond to the inflammation, like white blood cells, collect around the tears.", "Fat and cholesterol floating in the blood latch on, too, eventually building up to form a plaque that stiffens and thickens the inner arterial wall.", "[Ⓔ] This condition is called atherosclerosis, and it can have dangerous consequences.", "If the plaque ruptures, a blood clot forms on top of the tear, clogging the already narrowed pipe.", "If the clot is big enough, it can completely block the flow of oxygen and nutrients to cells downstream.", "In vessels that feed the heart, that will cause a heart attack, when oxygen-deprived cardiac muscle cells start to die.", "If the clot cuts off blood flow to the brain, it causes a stroke.", "[Ⓕ] Dangerously clogged blood vessels can be widened by a procedure called an angioplasty.", "There, doctors thread a wire through the vessel to the obstructed site, and then place a deflated balloon catheter over the wire.", "When the balloon is inflated, it forces the passageway open again.", "Sometimes a rigid tube called a stent is placed in a vessel to help hold it open, letting the blood flow freely to replenish the oxygen-starved cells downstream.", "Staying flexible under pressure is a tough job for arteries.", "The fluid they pump is composed of substances that can get sticky and clog them, and your typical healthy heart beats about 70 times a minute, and at least 2.5 billion times during an average lifetime.", "That may sound like an insurmountable amount of pressure, but don't worry, your arteries are well suited to the challenge."], "KO": ["[Ⓐ] 만약 당신의 몸속 모든 혈관을 한 줄로 늘어놓는다면, 그것들은 95,000km 길이가 될 것이고, 매일 7,500리터가 넘는 혈액에 해당하는 양을 운반하는데, 사실 그것은 같은 4~5리터가 계속 반복해서 재순환되는 것으로, 산소와 포도당·아미노산 같은 귀중한 영양소를 몸의 조직에 전달한다.", "[Ⓑ] 그 모든 혈액은 혈관의 근육 벽에 힘을 가한다.", "그 힘은 혈압이라고 불리며, 그것은 심장박동의 단계에 따라 오르고 내린다.", "그것은 수축기(systole) 동안, 즉 심장이 수축하여 혈액을 동맥으로 밀어낼 때 가장 높다.", "이것이 당신의 수축기 혈압이다.", "심장이 박동 사이에 쉬고 있을 때, 혈압은 가장 낮은 값, 즉 확장기 혈압으로 떨어진다.", "전형적인 건강한 사람은 90~120mmHg 사이의 수축기 혈압과 60~80 사이의 확장기 혈압을 만들어 낸다.", "둘을 합치면, 정상 측정값은 120/80보다 조금 낮다.", "[Ⓒ] 혈액은 순환계의 파이프를 통해 몸의 지형을 가로질러 흐른다.", "어떤 배관 시스템에서든, 몇 가지가 파이프 벽에 가해지는 힘을 증가시킬 수 있다: 유체의 성질, 추가된 유체, 또는 더 좁은 파이프.", "그래서 만약 혈액이 진해지면, 그것을 밀어내기 위해 더 높은 압력이 필요하므로, 심장은 더 세게 펌프질할 것이다.", "고염식은 비슷한 결과로 이어질 것이다.", "소금은 수분 저류(물이 몸에 남는 것)를 촉진하고, 그 추가된 체액이 혈액량과 혈압을 높이며, 투쟁-도피 반응 같은 스트레스는 에피네프린과 노르에피네프린 같은 호르몬을 분비하는데, 이것들은 주요 혈관을 수축시켜 흐름에 대한 저항을 높이고 상류의 압력을 올린다.", "[Ⓓ] 혈관은 보통 이러한 변동을 쉽게 감당할 수 있다.", "혈관 벽에 박혀 있는 탄성 섬유가 혈관을 회복력 있게 만들지만, 만약 당신의 혈압이 규칙적으로 약 140/90 이상으로 오르고 — 이것을 우리는 고혈압이라 부른다 — 거기에 머문다면, 그것은 심각한 문제를 일으킬 수 있다.", "그것은 동맥 벽에 가해지는 추가 부담이 작은 파열(찢어짐)을 만들 수 있기 때문이다.", "손상된 조직이 부어오르면, 백혈구처럼 염증에 반응하는 물질들이 파열 부위 주변에 모인다.", "혈액 속을 떠다니는 지방과 콜레스테롤도 달라붙어, 결국 쌓여서 동맥 안쪽 벽을 뻣뻣하고 두껍게 만드는 플라크를 형성한다.", "[Ⓔ] 이 상태는 동맥경화증이라고 불리며, 위험한 결과를 낳을 수 있다.", "플라크가 터지면, 파열 부위 위에 혈전(핏덩이)이 형성되어 이미 좁아진 관을 막는다.", "혈전이 충분히 크면, 그것은 하류의 세포로 가는 산소와 영양소의 흐름을 완전히 막을 수 있다.", "심장에 혈액을 공급하는 혈관에서, 그것은 심장마비를 일으키는데, 이때 산소가 결핍된 심근 세포들이 죽기 시작한다.", "혈전이 뇌로 가는 혈류를 차단하면, 그것은 뇌졸중을 일으킨다.", "[Ⓕ] 위험하게 막힌 혈관은 혈관성형술이라고 불리는 시술로 넓힐 수 있다.", "거기서 의사들은 혈관을 통해 막힌 부위까지 철사를 밀어 넣은 다음, 바람이 빠진 풍선 카테터를 그 철사 위에 놓는다.", "풍선이 부풀려지면, 그것은 통로를 다시 강제로 연다.", "때로는 스텐트라고 불리는 단단한 관을 혈관에 넣어 혈관이 열린 채로 유지되도록 돕고, 혈액이 자유롭게 흘러 하류의 산소가 부족한 세포들을 다시 채우게 한다.", "압력 아래에서 유연함을 유지하는 것은 동맥에게 힘든 일이다.", "동맥이 펌프질하는 액체는 끈적해져서 동맥을 막을 수 있는 물질들로 이루어져 있고, 당신의 전형적인 건강한 심장은 1분에 약 70번, 평균 일생 동안 적어도 25억 번 뛴다.", "그것은 감당할 수 없는 양의 압력처럼 들릴 수 있지만, 걱정하지 마라, 당신의 동맥은 그 도전에 잘 맞게 되어 있다."], "NOTES": [{"id": "topic", "cat": "주제", "lab": "주제 / 요지", "model": "혈압은 혈액이 혈관 벽에 가하는 힘이며(정의·정상 수치), 혈액 점도·염분·스트레스로 오르고, 고혈압이 지속되면 플라크→동맥경화→심장마비·뇌졸중으로 이어질 수 있다. 혈관성형술로 치료하지만, 동맥은 본래 이 압력을 잘 견디도록 되어 있다.", "src": [3, 15, 19, 30], "detail": "글 전체가 ‘혈압’ 하나를 축으로 정의(Ⓑ) → 원인(Ⓒ) → 위험(Ⓓ·Ⓔ) → 치료와 안심(Ⓕ)으로 흐른다. 주제 선택지는 ‘혈압의 작동 원리와 고혈압의 위험’ 수준으로 넓게 잡아야 하고, 혈관성형술만, 고염식만, 혈관 길이만 다룬 선택지는 부분 정보다. 마지막 s30의 ‘don’t worry’는 경고로 끝나지 않고 안심으로 마무리한다는 점이 어조 문제의 핵심."}, {"id": "type", "cat": "글의 종류", "lab": "전개 방식", "model": "Ⓐ 혈관의 규모 소개 → Ⓑ 혈압의 정의·정상 수치 → Ⓒ 혈압을 높이는 요인(배관 비유) → Ⓓ 고혈압 → 플라크 형성 과정 → Ⓔ 동맥경화의 결과(심장마비·뇌졸중) → Ⓕ 치료(혈관성형술·스텐트)와 마무리. 인과·과정 중심의 과학 설명문", "src": [1, 2, 9, 14, 19, 24], "detail": "각 문단 첫 문장이 전환점이다. Ⓒ의 배관(plumbing) 비유가 Ⓔ의 ‘pipe’, Ⓕ의 ‘passageway’까지 이어지므로 글 전체를 하나의 배관 이야기로 읽으면 순서 배열이 쉽다. 순서 문제에서는 ‘정의 → 원인 → 손상 과정 → 결과 → 치료’의 5단계로 외운다."}, {"id": "d1", "cat": "세부정보 · 혈관과 혈액의 수치", "lab": "숫자 4개 (s1)", "model": "① 혈관 총 길이 95,000km ② 하루 운반량 7,500리터 이상에 해당 ③ 실제로는 같은 4~5리터가 재순환 ④ 운반물: 산소 + 포도당·아미노산 같은 영양소 → 몸의 조직으로", "src": [1], "detail": "though(하지만) 앞뒤가 함정이다. 7,500리터는 ‘해당하는 양(the equivalent of)’이고, 실제 혈액은 4~5리터뿐이다. 이 둘을 바꿔 묻는 T/F가 나온다. delivering… 은 분사구문으로 ‘운반하면서 ~을 전달한다’는 뜻이며, 전달 대상 두 가지(산소, 영양소)와 영양소의 예 두 가지(glucose, amino acids)를 구분해 둔다."}, {"id": "d2", "cat": "정의 · 혈압", "lab": "혈압이란? (s2~3)", "model": "혈액이 혈관의 근육 벽(muscular walls)에 가하는 힘(force) = blood pressure. 심장박동의 단계(phases of the heartbeat)에 따라 오르내린다", "src": [2, 3], "detail": "s2의 ‘a force’를 s3의 ‘That force’가 받고, 그것에 이름을 붙인다(is called blood pressure). ‘exerts a force on ~’(~에 힘을 가하다) 표현을 그대로 외울 것. 혈압이 일정한 값이 아니라 박동에 따라 변한다(rises and falls)는 점이 뒤의 수축기/확장기 구분으로 이어진다."}, {"id": "c1", "cat": "대조 · 수축기 vs 확장기", "lab": "systolic vs diastolic (s4~6)", "model": "수축기 혈압(systolic): 심장이 수축(contracts)하여 동맥으로 혈액을 밀어낼 때 → 가장 높음 / 확장기 혈압(diastolic): 박동 사이 심장이 쉴 때(at rest) → 가장 낮음", "src": [4, 5, 6], "detail": "highest ↔ lowest, contracts ↔ at rest 가 짝이다. systole(명사) → systolic(형용사)으로 품사가 바뀐 것도 체크. 수축기와 확장기를 서로 바꾸거나, ‘심장이 쉴 때 가장 높다’로 뒤집는 오답이 단골이다."}, {"id": "d3", "cat": "세부정보 · 정상 혈압 수치", "lab": "숫자 (s7~8)", "model": "수축기 90~120 mmHg / 확장기 60~80 / 둘을 합친 정상 측정값 = 120/80보다 조금 낮은(a bit less than) 값", "src": [7, 8], "detail": "단위 millimeters of mercury(mmHg, 수은주 밀리미터)까지 기억. ‘a bit less than 120 over 80’에서 less를 more로 바꾸는 함정, 그리고 뒤 s15의 140/90(고혈압 기준)과 섞어 묻는 함정이 있다. 120/80은 정상, 140/90은 고혈압 — 두 숫자를 확실히 구분한다."}, {"id": "a1", "cat": "행위 · 배관의 압력을 높이는 것", "lab": "3가지 (s10) ↔ 실제 원인 (s11~13)", "model": "① 유체의 성질(properties of the fluid) ↔ 혈액이 진해짐(s11) ② 추가된 유체(extra fluid) ↔ 고염식→수분 저류(s12~13) ③ 더 좁은 파이프(narrower pipes) ↔ 스트레스 호르몬→혈관 수축(s13)", "src": [10, 11, 12, 13], "detail": "s10이 비유(배관)로 세 가지를 예고하고, s11~13이 그 순서대로 혈액에 적용한다. 이 대응 관계 자체가 시험 포인트다. ‘언급되지 않은 것’ 문제에서 탄성 섬유(s15)나 백혈구(s17)처럼 다른 문단의 단어가 오답으로 섞여 나온다."}, {"id": "c2", "cat": "원인→결과 · 혈액 점도", "lab": "진해진 혈액 (s11)", "model": "혈액이 진해지면(thickens) → 밀어내는 데 더 높은 압력 필요 → 심장이 더 세게(harder) 펌프질", "src": [11], "detail": "So … so … 로 인과가 두 번 이어진다. ‘더 세게’(harder)를 ‘더 약하게/천천히’로 바꾸는 오답에 주의. 여기서 압력이 필요한 주체는 혈액이고, 반응하는 주체는 심장이다."}, {"id": "c3", "cat": "원인→결과 · 고염식", "lab": "소금 → 혈압 (s12~13)", "model": "고염식(high-salt diet) → 소금이 수분 저류(water retention) 촉진 → 추가 체액이 혈액량(blood volume) 증가 → 혈압 상승 (s11과 ‘similar result’)", "src": [12, 13], "detail": "s12의 ‘a similar result’는 s11의 결과(압력 상승·심장이 더 세게 펌프)를 가리킨다. 소금이 직접 혈압을 올리는 것이 아니라 ‘물을 붙잡아 혈액량을 늘리기 때문’이라는 중간 단계가 있다. 이 중간 단계를 빼먹거나 순서를 바꾸는 오답에 주의."}, {"id": "c4", "cat": "원인→결과 · 스트레스", "lab": "호르몬 → 혈관 수축 (s13)", "model": "스트레스(투쟁-도피 반응) → 에피네프린·노르에피네프린 같은 호르몬 방출 → 주요 혈관 수축(constrict) → 흐름 저항(resistance) 증가 → 상류(upstream) 압력 상승", "src": [13], "detail": "constrict(수축시키다)를 widen/dilate(넓히다)로 뒤집는 오답이 가장 흔하다. ‘that constrict key vessels’의 that은 hormones를 받는 관계대명사이고, increasing…/raising… 은 결과를 나타내는 분사구문이다. 호르몬 이름 두 개(epinephrine, norepinephrine)도 세부 문제로 나올 수 있다."}, {"id": "d4", "cat": "세부정보 · 고혈압의 기준", "lab": "탄성 섬유와 140/90 (s14~15)", "model": "혈관 벽의 탄성 섬유(elastic fibers) → 회복력(resilient) → 보통은 변동을 쉽게 감당 / 그러나 혈압이 규칙적으로 약 140/90 이상으로 오르고 거기 머물면 = 고혈압(hypertension) → 심각한 문제", "src": [14, 15], "detail": "but 앞은 ‘괜찮은 경우’, 뒤는 ‘문제가 되는 경우’다. 조건이 두 개(regularly rises above 140/90 + stays there)라는 점에 주의 — 일시적으로 오르는 것은 고혈압이 아니다. ‘what we call hypertension’은 삽입구로 앞 내용에 이름을 붙인다."}, {"id": "o1", "cat": "순서 · 플라크 형성 과정", "lab": "4단계 (s16~18)", "model": "① 추가 부담(strain)으로 동맥 벽에 작은 파열(tears) → ② 손상 조직이 부어오르고 염증 반응 물질(백혈구 등)이 파열 주변에 모임 → ③ 혈액 속 지방·콜레스테롤도 달라붙음(latch on) → ④ 쌓여서 플라크 형성 → 동맥 안쪽 벽이 뻣뻣하고 두꺼워짐", "src": [16, 17, 18], "detail": "s16의 That’s because는 s15의 ‘serious problems’의 이유를 여는 문장이다. 백혈구(s17)가 먼저 모이고 지방·콜레스테롤(s18)이 ‘too’로 뒤따르는 순서를 바꾸는 오답에 주의. 플라크의 결과는 두 가지(stiffens, thickens)다."}, {"id": "o2", "cat": "순서 · 동맥경화의 결과", "lab": "플라크 → 혈전 → 차단 (s19~23)", "model": "이 상태 = 동맥경화증(atherosclerosis) → 플라크 파열(ruptures) → 파열 위에 혈전(blood clot) 형성 → 이미 좁아진 관을 막음 → 혈전이 충분히 크면 하류 세포로 가는 산소·영양 흐름을 완전히 차단", "src": [19, 20, 21], "detail": "플라크 자체가 아니라 ‘플라크가 터진 뒤 생기는 혈전’이 관을 막는다는 순서가 중요하다. ‘already narrowed’는 플라크로 이미 좁아졌음을 뜻한다. 결과가 ‘완전 차단’이 되려면 조건(If the clot is big enough)이 필요하다."}, {"id": "c5", "cat": "대조 · 심장마비 vs 뇌졸중", "lab": "heart attack vs stroke (s22~23)", "model": "심장에 혈액을 공급하는 혈관이 막히면 → 심장마비(heart attack): 산소 결핍된 심근 세포가 죽기 시작 / 뇌로 가는 혈류가 차단되면 → 뇌졸중(stroke)", "src": [22, 23], "detail": "같은 원인(혈전)이 위치에 따라 다른 병명이 된다. 장소를 바꾸는 오답(뇌 혈관 → 심장마비)이 전형적 함정. ‘vessels that feed the heart’의 feed는 ‘먹이다’가 아니라 ‘(혈액을) 공급하다’. oxygen-deprived = 산소가 결핍된."}, {"id": "o3", "cat": "순서 · 혈관성형술 절차", "lab": "angioplasty 4단계 + 스텐트 (s24~27)", "model": "① 철사(wire)를 혈관 통해 막힌 부위까지 밀어 넣음 → ② 바람 빠진(deflated) 풍선 카테터를 철사 위에 놓음 → ③ 풍선을 부풀리면(inflated) 통로가 다시 열림 → ④ 때로 단단한 관 스텐트(stent)를 넣어 열린 채 유지 → 혈액이 자유롭게 흘러 산소 부족 세포에 보충(replenish)", "src": [24, 25, 26, 27], "detail": "deflated(바람 빠진) → inflated(부풀린) 순서가 핵심이다. 철사가 먼저, 카테터가 그 위에 온다. 스텐트는 ‘항상’이 아니라 ‘때로(Sometimes)’ 쓰는 추가 장치이며 역할은 hold it open(열린 채 유지)이다. 이 시술은 원인을 없애는 것이 아니라 막힌 관을 넓히는 것이다."}, {"id": "d5", "cat": "세부정보 · 심장 박동 수치", "lab": "숫자 2개 (s29)", "model": "건강한 심장: 1분에 약 70회 / 평균 일생 동안 최소 25억(2.5 billion) 회", "src": [29], "detail": "70(분당)과 2.5 billion(평생)의 단위를 바꿔 묻는 T/F가 나온다. ‘at least’(최소)를 ‘at most’로 바꾸는 함정도 가능. s1의 95,000·7,500·4~5와 함께 이 글의 숫자들을 표로 정리해 두면 세부정보 문제가 한 번에 해결된다."}, {"id": "l1", "cat": "논리 · 마무리", "lab": "힘든 일 → but 걱정 마라 (s28~30)", "model": "압력 아래서 유연함을 유지하는 것은 동맥에게 힘든 일(끈적해지는 물질, 엄청난 박동 횟수) → 감당 못 할 압력처럼 들릴 수 있지만(may sound insurmountable) → but 걱정 마라, 동맥은 그 도전에 잘 맞게 되어 있다(well suited)", "src": [28, 29, 30], "detail": "s28~29가 ‘어려움’을 쌓고, s30이 but으로 뒤집어 안심시킨다. 글의 마지막 어조는 경고가 아니라 낙관(reassuring)이다. ‘may sound like … but …’는 양보→반전 구조로, 빈칸 문제에서 but 뒤에 긍정 내용이 와야 한다는 단서가 된다."}, {"id": "p1", "cat": "지시어", "lab": "that (s1), It (s4), This (s5), that (s22)", "model": "that(s1) = 하루 7,500리터에 해당하는 양 / It(s4) = blood pressure / This(s5) = 수축기에 가장 높은 혈압(앞 문장 내용) / that(s22) = 혈전이 산소·영양 흐름을 완전히 막는 것", "src": [1, 4, 5, 22], "detail": "It(s4)은 s3의 blood pressure를 받는다(heart가 아니다). This(s5)는 바로 앞 문장 전체(‘수축기에 가장 높다’)를 받아 이름을 붙인다. that(s22)은 s21의 ‘완전 차단’을 받는다. 지시어는 항상 바로 앞을 먼저 본다."}, {"id": "p2", "cat": "지시어", "lab": "these fluctuations (s14), their (s15), This condition (s19), There (s25), they/them (s29)", "model": "these fluctuations = s11~13에서 말한 혈압의 오르내림 / their = blood vessels’ / This condition = 플라크가 동맥 안쪽 벽을 뻣뻣·두껍게 만든 상태 / There = 혈관성형술에서 / they, them = arteries", "src": [14, 15, 19, 25, 29], "detail": "This condition(s19)에 ‘atherosclerosis’라는 이름이 붙으므로, 그 조건이 무엇인지(s18의 플라크 형성)를 정확히 짚어야 한다. There(s25)는 장소가 아니라 ‘그 시술에서’라는 뜻. s29의 they와 them은 모두 s28의 arteries다."}], "VOCAB": [["exert", "(힘을) 가하다"], ["systolic", "수축기의"], ["diastolic", "확장기의"], ["traverse", "가로지르다"], ["retention", "저류, 보유"], ["constrict", "수축시키다"], ["resistance", "저항"], ["fluctuation", "변동"], ["resilient", "회복력 있는"], ["hypertension", "고혈압"], ["strain", "부담, 긴장"], ["inflammation", "염증"], ["plaque", "플라크, 침착물"], ["rupture", "터지다, 파열하다"], ["clot", "혈전, 핏덩이"], ["deprived", "결핍된"], ["obstructed", "막힌"], ["replenish", "다시 채우다"], ["insurmountable", "극복할 수 없는"]], "Q": [{"type": "mc", "note": "topic", "stem": "이 글의 주제로 가장 적절한 것은?", "opts": ["how angioplasty replaced older heart surgeries", "why a high-salt diet is the main cause of stroke", "what blood pressure is, why it rises, and how hypertension damages arteries", "the total length of blood vessels in the human body", "how white blood cells fight infection in the arteries"], "ans": 2}, {"type": "mc", "note": "d1", "stem": "s1의 내용으로 옳지 <u>않은</u> 것은?", "opts": ["The blood vessels in the body would be 95,000 kilometers long if lined up.", "The vessels carry the equivalent of over 7,500 liters of blood every day.", "The body actually contains only four or five liters of blood.", "The blood delivers oxygen and nutrients like glucose and amino acids.", "The body produces 7,500 liters of new blood every day."], "ans": 4}, {"type": "mc", "note": "c1", "stem": "systolic blood pressure에 대한 설명으로 가장 적절한 것은?", "opts": ["the pressure when the heart is at rest between beats", "the lowest value of blood pressure", "the pressure when the heart contracts to force blood through the arteries", "the pressure that stays above 140 over 90", "the pressure caused by a high-salt diet"], "ans": 2}, {"type": "tf", "note": "d3", "stem": "A normal reading is a bit more than 120 over 80.", "ans": false, "why": "a bit less than 120 over 80 — 120/80보다 조금 낮음(s8)"}, {"type": "tf", "note": "d2", "stem": "Blood pressure rises and falls with the phases of the heartbeat.", "ans": true, "why": "s3에 그대로 언급"}, {"type": "tf", "note": "c2", "stem": "If the blood thickens, the heart will pump more gently.", "ans": false, "why": "더 세게(harder) 펌프질함(s11)"}, {"type": "tf", "note": "c3", "stem": "Salt promotes water retention, and the extra fluid increases the blood volume.", "ans": true, "why": "s13에 그대로 언급"}, {"type": "tf", "note": "c4", "stem": "Stress hormones like epinephrine widen key vessels, lowering the pressure upstream.", "ans": false, "why": "혈관을 수축(constrict)시켜 상류 압력을 올림(s13)"}, {"type": "tf", "note": "d4", "stem": "Elastic fibers embedded in the vessel walls make them resilient.", "ans": true, "why": "s15에 그대로 언급"}, {"type": "tf", "note": "c5", "stem": "If a clot cuts off blood flow to the brain, it causes a heart attack.", "ans": false, "why": "뇌 → 뇌졸중(stroke), 심장 혈관 → 심장마비(s22~23)"}, {"type": "tf", "note": "d5", "stem": "A typical healthy heart beats at least 2.5 billion times during an average lifetime.", "ans": true, "why": "s29에 그대로 언급"}, {"type": "match", "note": const $=s=>document.querySelector(s);
const noteById=id=>NOTES.find(n=>n.id===id);

function renderPassage(el,clickable){
  const p=document.createElement('p');
  S.forEach((s,i)=>{
    const sp=document.createElement('span');sp.className='sent';sp.dataset.i=i+1;
    sp.innerHTML=`<b>s${i+1}</b>${s} `;
    if(clickable) sp.onclick=()=>hlFromSent(i+1);
    p.appendChild(sp);
    const k=document.createElement('div');k.className='ko';k.textContent=KO[i];p.appendChild(k);
  });
  el.appendChild(p);
}
function toggleKo(id){$('#'+id).classList.toggle('showko')}

function renderNotes(el){ // ① 문제 풀기의 「노트」 서랍용
  NOTES.forEach(n=>{
    const d=document.createElement('div');d.className='note';d.dataset.id=n.id;
    d.innerHTML=`<div class="cat">${n.cat}</div><div class="lab">${n.lab}<span class="src">s${n.src.join(', s')}</span></div><div class="model">${n.model}</div>`;

  el.appendChild(v);
}

// 문제
const state={};let cur=0;let graded=false;
const HOW={mc:'하나를 고르세요',tf:'True 또는 False를 고르세요',match:'왼쪽 항목 순서대로, 아래에서 짝을 누르세요',order:'아래 항목을 글의 순서대로 누르세요',blank:'빈칸을 누른 뒤 단어를 고르세요'};
const KIND={mc:'선택형',tf:'True / False',match:'짝 연결',order:'순서 배열',blank:'요약문 빈칸'};
function initState(){Q.forEach((q,i)=>{if(q.type==='match')state[i]=q.left.map(()=>-1);else if(q.type==='order')state[i]=[];else if(q.type==='blank')state[i]=['','',''];else state[i]=undefined;if(q.type==='order')q._shuf=shuffle(q.items.map((_,k)=>k))})}
function answered(i){const s=state[i],q=Q[i];if(q.type==='match')return s.every(v=>v>=0);if(q.type==='order')return s.length===q.items.length;if(q.type==='blank')return s.every(v=>v);return s!==undefined}
function isOk(i){const s=state[i],q=Q[i];if(q.type==='mc')return s===q.ans;if(q.type==='tf')return s===(q.ans?1:0);if(q.type==='match')return s.every((v,k)=>v===q.ans[k]);if(q.type==='order')return s.length===q.ans.length&&s.every((v,k)=>v===q.ans[k]);return s.every((v,k)=>v===q.ans[k])}
function ansText(q){return q.type==='mc'?q.opts[q.ans]:q.type==='tf'?(q.ans?'True':'False')+(q.why?' — '+q.why:''):q.type==='match'?q.left.map((l,i)=>`${l} → ${q.right[q.ans[i]]}`).join(' / '):q.type==='order'?q.ans.map(i=>q.items[i]).join(' → '):q.ans.map((a,i)=>`(${'ABC'[i]}) ${a}`).join('  ')}
function mineText(i){const s=state[i],q=Q[i];if(!answered(i))return '(미응답)';if(q.type==='mc')return q.opts[s];if(q.type==='tf')return s?'True':'False';if(q.type==='match')return s.map((v,k)=>`${q.left[k]} → ${q.right[v]}`).join(' / ');if(q.type==='order')return s.map(k=>q.items[k]).join(' → ');return s.map((v,k)=>`(${'ABC'[k]}) ${v}`).join('  ')}

function renderQ(){
  const q=Q[cur],s=state[cur],box=$('#qs');
  let h=`<div class="qcard ${graded?'graded':''}"><span class="kind">${KIND[q.type]}</span><span class="qno">${cur+1}번 / 총 ${Q.length}문항</span><div class="stem">${q.stem}</div><div class="how">${graded?'':HOW[q.type]}</div>`;
  const mark=(i,isAns)=>graded?(isAns?'right':(i===s?'wrong':'')):(i===s?'sel':'');
  if(q.type==='mc')h+=q.opts.map((o,i)=>`<div class="opt ${mark(i,i===q.ans)}" onclick="pick(${i})"><span class="k">${i+1}</span><span>${o}</span></div>`).join('');
  if(q.type==='tf')h+=`<div class="tf"><div class="opt ${mark(1,q.ans)}" onclick="pick(1)">True</div><div class="opt ${mark(0,!q.ans)}" onclick="pick(0)">False</div></div>`;
  if(q.type==='match'){const act=s.indexOf(-1);
    h+=`<div class="pairs">`+q.left.map((l,i)=>{const cls=graded?(s[i]===q.ans[i]?'right':'wrong'):(i===act?'active':'');
      return `<div class="pair ${cls}"><span class="l">${l}</span><span class="arrow">→</span><span class="r ${s[i]>=0?'set':''}">${s[i]>=0?q.right[s[i]]:'짝을 고르세요'}</span>${s[i]>=0&&!graded?`<button class="x" onclick="unpair(${i})">×</button>`:''}</div>`}).join('')+`</div>`;
    if(!graded)h+=`<div class="bank">`+q.right.map((r,j)=>`<span class="chip ${s.includes(j)||act<0?'used':''}" onclick="pair(${j})">${r}</span>`).join('')+`</div>`}
  if(q.type==='order'){h+=`<div class="slots">`+q.items.map((_,i)=>{const v=s[i];const cls=graded?(v===q.ans[i]?'right':'wrong'):(v===undefined?(i===s.length?'next empty':'empty'):'filled');
      return `<div class="slot ${cls}" onclick="unslot(${i})"><span class="n">${i+1}</span><span>${v===undefined?'':q.items[v]}</span></div>`}).join('')+`</div>`;
    if(!graded)h+=`<div class="bank">`+q._shuf.map(i=>`<span class="chip ${s.includes(i)?'used':''}" onclick="slot(${i})">${q.items[i]}</span>`).join('')+`</div>`}
  if(q.type==='blank'){const act=s.indexOf('');let t=q.text;['A','B','C'].forEach((k,i)=>{const cls=graded?(s[i]===q.ans[i]?'right':'wrong'):(i===(q._act??act)?'active':(s[i]?'set':''));t=t.replace(`(${k})`,`<span class="blank ${cls}" onclick="setBlank(${i})">${s[i]||'('+k+')'}</span>`)});
    h+=`<div class="sumtext">${t}</div>`;
    if(!graded)h+=`<div class="bank">`+q.bank.map(b=>`<span class="chip ${s.includes(b)?'used':''}" onclick="fillBlank('${b}')">${b}</span>`).join('')+`</div>`}
  const nn=noteById(q.note),src=nn.src.map(k=>`<div><b>s${k}</b> ${S[k-1]}<span class="k">${KO[k-1]}</span></div>`).join('');
  if(!graded)h+=`<button class="btn sm" style="margin-top:16px" onclick="toggleHint()">${q._hint?'힌트 닫기':'💡 근거 문장 힌트'}</button><div class="hintbox ${q._hint?'on':''}">${src}</div>`;
  if(graded){const ok=isOk(cur);h+=`<div class="fb ${ok?'ok':'no'}"><div class="t">${ok?'✔ 정답입니다':'✘ 틀렸습니다'}</div>정답: <b>${ansText(q)}</b>${ok?'':'<br>내 답: '+mineText(cur)}
    <div class="ev"><b>놓치기 쉬운 포인트</b> [${nn.cat} · ${nn.lab}] ${nn.model}<div style="margin-top:8px"><b>근거 문장</b></div>${src}</div></div>`}
  h+=`</div>`;box.innerHTML=h;
  $('#pnum').textContent=`${cur+1} / ${Q.length}`;$('#pfill').style.width=((cur+1)/Q.length*100)+'%';
  $('#bPrev').disabled=cur===0;
  const last=cur===Q.length-1;$('#bNext').textContent=last?(graded?'결과 보기':'채점'):'다음';
  $('#dots').innerHTML=Q.map((_,i)=>`<i class="${i===cur?'cur ':''}${graded?(isOk(i)?'ok':'no'):(answered(i)?'done':'')}" onclick="goQ(${i})"></i>`).join('');
}
function pick(i){if(graded)return;state[cur]=i;renderQ()}
function pair(j){if(graded)return;const s=state[cur],a=s.indexOf(-1);if(a<0||s.includes(j))return;s[a]=j;renderQ()}
function unpair(i){state[cur][i]=-1;renderQ()}
function slot(i){if(graded)return;const s=state[cur];if(s.includes(i))return;s.push(i);renderQ()}
function unslot(i){if(graded)return;const s=state[cur];if(s[i]===undefined)return;s.splice(i);renderQ()}
function setBlank(i){if(graded)return;Q[cur]._act=i;renderQ()}
function fillBlank(w){if(graded)return;const q=Q[cur],s=state[cur];let i=q._act??s.indexOf('');if(i<0)return;s[i]=w;q._act=undefined;renderQ()}
function toggleHint(){Q[cur]._hint=!Q[cur]._hint;renderQ()}
function goQ(i){cur=i;renderQ()}
function moveQ(d){if(d>0&&cur===Q.length-1){if(graded)goTab('t4');else grade();return}cur=Math.max(0,Math.min(Q.length-1,cur+d));renderQ()}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function toggleSide(id,b){$('#'+id).classList.toggle('on');b.classList.toggle('fill')}
function resetQ(){graded=false;cur=0;initState();renderQ();$('#result').innerHTML='<p class="small">① 문제 풀기에서 채점하면 결과가 여기에 나타납니다.</p>'}

function grade(){
  const un=Q.map((_,i)=>i).filter(i=>!answered(i));
  if(un.length&&!confirm(`아직 안 푼 문항: ${un.map(i=>i+1).join(', ')}번\n그래도 채점할까요?`))return;
  graded=true;
  let score=0;const wrong=[];
  Q.forEach((q,i)=>{if(isOk(i))score++;else wrong.push(i)});
  const pct=Math.round(score/Q.length*100);
  const msg=pct===100?'완벽합니다!':pct>=80?'잘했어요. 틀린 문항만 다시 확인하세요.':pct>=60?'지문을 다시 읽고 놓친 노트를 채워 보세요.':'지문을 문장 단위로 다시 정리해야 합니다.';
  let h=`<div class="scorewrap"><div class="scorecircle"><b>${score}</b><span>/ ${Q.length}문항 · ${pct}%</span></div>
    <div class="scoremsg">${msg}<small>아래에서 <b>틀린 문항 → 놓친 노트 → 근거 문장(해석)</b> 순으로 되짚어 봅니다.<br>문항 번호를 누르면 해당 문제로 돌아갑니다.</small></div></div>`;
  h+=`<div class="allq">`+Q.map((q,i)=>`<div class="${isOk(i)?'ok':'no'}" onclick="goTab('t3');goQ(${i})"><b>${i+1}</b>${isOk(i)?'정답':'오답'}</div>`).join('')+`</div>`;
  if(wrong.length){
    const missed={};wrong.forEach(i=>{const c=noteById(Q[i].note).cat.split(' ·')[0];missed[c]=(missed[c]||0)+1});
    h+=`<div class="h3">취약 유형</div><div class="weak">${Object.entries(missed).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<span>${k} ${v}문항</span>`).join('')}</div>`;
    h+=`<div class="h3">틀린 문항 다시 보기</div>`;
    wrong.forEach(i=>{const q=Q[i],n=noteById(q.note);
      h+=`<div class="res"><div class="qh">${i+1}. ${q.stem}</div>
      <div class="step"><span class="tag mine">내 답</span><span>${mineText(i)}</span></div>
      <div class="step"><span class="tag ans">정답</span><span>${ansText(q)}</span></div>
      <div class="step"><span class="tag note">놓친 노트</span><span>[${n.cat} · ${n.lab}]<br>${n.model}</span></div>
      <div class="step"><span class="tag src">근거 문장</span><span>${n.src.map(k=>`<b>s${k}</b> ${S[k-1]}<span class="k">${KO[k-1]}</span>`).join('')}</span></div></div>`});
  }
  h+=`<div class="tools" style="margin-top:18px"><button class="btn" style="font-size:15px;padding:12px 20px" onclick="goTab('t3');goQ(0)">해설 보며 다시 보기</button><button class="btn fill" style="font-size:15px;padding:12px 20px" onclick="resetQ();goTab('t3')">처음부터 다시 풀기</button></div>`;
  $('#result').innerHTML=h;
  goTab('t4');
}

// 탭
function goTab(id){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===id));document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.id===id));window.scrollTo(0,0)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>goTab(b.dataset.t));

renderPassage($('#sP2'),false);renderNotesPage();
renderPassage($('#sP'),false);renderNotes($('#sN'));
initState();renderQ();
</script>
</body>
</html>
