<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>독해 노트 · 2026년 2학기 신목고1 중간고사 추가읽기 · “Talking” Baby Bats (2022 카이스트 기출)</title>
<style>
:root{
  --ink:#1c2230; --sub:#5b6473; --line:#d9dde5; --paper:#fbfbf9; --panel:#ffffff;
  --navy:#243b6b; --navy-soft:#e9eef8; --mark:#fff3b0; --ok:#2e7d4f; --ok-soft:#e5f3ea; --no:#b3382b; --no-soft:#fbe9e6;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;font-size:15px;line-height:1.6}
header{background:var(--navy);color:#fff;padding:18px 20px}
header h1{margin:0;font-size:18px;font-weight:600}
header p{margin:4px 0 0;font-size:13px;opacity:.85}
nav{display:flex;border-bottom:2px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
nav button{flex:1;padding:12px 4px;border:0;background:none;font:inherit;font-size:14px;color:var(--sub);border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer}
nav button.on{color:var(--navy);border-color:var(--navy);font-weight:600}
nav button[data-t="t2"],nav button[data-t="t3"]{color:var(--no);font-weight:700;font-size:17px}
nav button[data-t="t2"].on,nav button[data-t="t3"].on{color:var(--no);border-color:var(--no)}
main{max-width:960px;margin:0 auto;padding:16px}
.tab{display:none}.tab.on{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.box{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.box h2{margin:0 0 10px;font-size:15px;color:var(--navy)}
.sent{padding:3px 4px;border-radius:3px;cursor:pointer;transition:background .15s}
.sent b{color:var(--sub);font-size:11px;margin-right:4px;font-weight:600}
.sent.hl{background:var(--mark)}
.sent.dim{opacity:.35}
.ko{display:none;color:var(--sub);font-size:13px;margin:2px 0 8px 22px}
.showko .ko{display:block}
.passage p{margin:0}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.btn{padding:7px 12px;border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:4px;font:inherit;font-size:13px;cursor:pointer}
.btn.fill{background:var(--navy);color:#fff}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.off{opacity:.5}
.note{border-left:3px solid var(--line);padding:6px 10px;margin:6px 0;cursor:pointer;border-radius:0 4px 4px 0}
.note.hl{border-color:var(--navy);background:var(--navy-soft)}
.note .cat{font-size:11px;color:var(--sub)}
.note .lab{font-weight:600;font-size:14px}
.note .model{font-size:14px;margin-top:2px}
.note textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:4px;padding:6px;font:inherit;font-size:14px;resize:vertical;margin-top:4px}
.note .ans{display:none;margin-top:6px;padding:6px 8px;background:var(--ok-soft);border-radius:4px;font-size:13px}
.note.open .ans{display:block}
.note .ans{font-size:14px;line-height:1.6}
.src{font-size:11px;color:var(--sub);margin-left:6px}
.vocab{display:flex;flex-wrap:wrap;gap:6px}
.vocab span{background:var(--navy-soft);padding:2px 8px;border-radius:3px;font-size:13px}
.vocab span i{font-style:normal;color:var(--sub);margin-left:4px}
.q{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:12px}
.q .num{font-size:12px;color:var(--sub)}
.q .stem{font-weight:600;margin:2px 0 8px}
.opt{display:block;padding:6px 8px;border:1px solid var(--line);border-radius:4px;margin:4px 0;cursor:pointer;font-size:14px}
.opt.sel{border-color:var(--navy);background:var(--navy-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--no);background:var(--no-soft)}
.row{display:flex;gap:8px;align-items:center;margin:4px 0;flex-wrap:wrap}
.row span.l{min-width:130px;font-weight:600}
select{font:inherit;font-size:14px;padding:4px;border:1px solid var(--line);border-radius:4px;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 10px;border:1px solid var(--line);border-radius:4px;cursor:pointer;background:#fff;font-size:13px}
.chip.used{opacity:.3;pointer-events:none}
.ordered{min-height:34px;border:1px dashed var(--line);border-radius:4px;padding:6px;margin:6px 0;font-size:13px}
.ordered div{padding:3px 6px}
.fb{display:none;margin-top:8px;font-size:13px;padding:6px 8px;border-radius:4px}
.graded .fb{display:block}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.no{background:var(--no-soft);color:var(--no)}
.side{display:none}
.side.on{display:block}
.score{font-size:22px;font-weight:600;color:var(--navy)}
.res{border-left:3px solid var(--no);padding:8px 12px;margin:10px 0;background:var(--panel);border-radius:0 4px 4px 0}
.res.ok{border-color:var(--ok)}
.res .trace{font-size:13px;color:var(--sub);margin-top:4px}
.res .trace b{color:var(--ink)}
.small{font-size:12px;color:var(--sub)}

/* ── 문제 풀기 ── */
.qbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.prog{flex:1;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--sub);white-space:nowrap}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--navy);width:0;transition:width .2s}
.switches{display:flex;gap:6px}
.sw{padding:5px 12px;border:1px solid var(--line);background:#fff;border-radius:20px;font:inherit;font-size:13px;color:var(--sub);cursor:pointer}
.sw.fill{background:var(--navy);color:#fff;border-color:var(--navy)}
.drawer{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:10px;max-height:260px;overflow:auto;font-size:14px}
.drawer .note{cursor:default;padding:3px 8px;margin:3px 0}
.drawer .note .cat{display:inline;margin-right:6px}
.drawer .note .lab{display:inline;font-size:13px}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px 18px;min-height:300px}
.qcard .kind{display:inline-block;font-size:12px;color:var(--navy);background:var(--navy-soft);padding:2px 8px;border-radius:3px}
.qcard .stem{font-size:17px;font-weight:600;margin:10px 0 4px;line-height:1.5}
.qcard .how{font-size:13px;color:var(--sub);margin-bottom:14px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;margin:8px 0;cursor:pointer;font-size:15px}
.opt .k{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);font-size:12px;display:flex;align-items:center;justify-content:center;color:var(--sub)}
.opt.sel{border-color:var(--navy);background:var(--navy-soft)}
.opt.sel .k{background:var(--navy);color:#fff;border-color:var(--navy)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--no);background:var(--no-soft)}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf .opt{justify-content:center;font-size:17px;padding:16px}
.pairs{margin-bottom:12px}
.pair{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;margin:6px 0;font-size:14px}
.pair.active{border-color:var(--navy);background:var(--navy-soft)}
.pair .l{font-weight:600;min-width:120px}
.pair .arrow{color:var(--sub)}
.pair .r{flex:1;color:var(--sub)}
.pair .r.set{color:var(--ink)}
.pair .x{border:0;background:none;color:var(--sub);cursor:pointer;font-size:16px}
.pair.right{border-color:var(--ok);background:var(--ok-soft)}
.pair.wrong{border-color:var(--no);background:var(--no-soft)}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border:1.5px solid var(--line);border-radius:8px;cursor:pointer;background:#fff;font-size:14px}
.chip.used{opacity:.25;pointer-events:none}
.slots{margin-bottom:14px}
.slot{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1.5px dashed var(--line);border-radius:8px;margin:6px 0;min-height:42px;font-size:14px;cursor:pointer}
.slot .n{flex:none;width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}
.slot.empty{color:var(--sub)}
.slot.filled{border-style:solid;background:#fff}
.slot.next{border-color:var(--navy);background:var(--navy-soft)}
.slot.right{border-color:var(--ok);background:var(--ok-soft)}
.slot.wrong{border-color:var(--no);background:var(--no-soft)}
.sumtext{font-size:16px;line-height:2.1;margin-bottom:14px}
.blank{display:inline-block;min-width:110px;padding:2px 10px;border-bottom:2px solid var(--line);margin:0 3px;cursor:pointer;text-align:center;color:var(--sub);font-weight:600}
.blank.active{border-color:var(--navy);background:var(--navy-soft);color:var(--navy)}
.blank.set{color:var(--ink);border-color:var(--ink)}
.blank.right{color:var(--ok);border-color:var(--ok)}
.blank.wrong{color:var(--no);border-color:var(--no)}
.fb{display:none;margin-top:14px;font-size:14px;padding:10px 12px;border-radius:6px}
.graded .fb{display:block}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.no{background:var(--no-soft);color:var(--no)}
.qnav{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px}
.qnav .btn{padding:10px 22px;font-size:14px}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);cursor:pointer}
.dots i.done{background:var(--navy)}
.dots i.cur{outline:2px solid var(--navy);outline-offset:2px}
.dots i.ok{background:var(--ok)}
.dots i.no{background:var(--no)}

/* ── v1.1 ③④ 큰 글씨·가독성 ── */
.qcard{padding:26px 24px}
.qcard .kind{font-size:17px;font-weight:700;color:var(--no);background:var(--no-soft);padding:6px 16px;border-radius:20px}
.qcard .qno{font-size:17px;color:var(--no);margin-left:12px;font-weight:700}
.qcard .stem{font-size:21px;margin:14px 0 6px;line-height:1.55}
.qcard .how{font-size:15px;margin-bottom:18px}
.qcard .opt{font-size:17px;padding:14px 16px;margin:10px 0;line-height:1.5}
.qcard .opt .k{width:28px;height:28px;font-size:14px}
.tf .opt{font-size:22px;padding:22px}
.pair{font-size:17px;padding:12px 14px}
.pair .l{min-width:140px}
.pair .r{font-size:16px}
.chip{font-size:16px;padding:11px 16px}
.slot{font-size:17px;padding:12px 14px;min-height:50px}
.slot .n{width:28px;height:28px;font-size:14px}
.sumtext{font-size:19px;line-height:2.3}
.blank{min-width:130px;font-size:18px}
.fb{font-size:16px;padding:14px 16px;line-height:1.7}
.fb .t{font-size:19px;font-weight:700;margin-bottom:6px}
.fb .ev{margin-top:12px;padding-top:12px;border-top:1px dashed currentColor;color:var(--ink);font-size:15px}
.fb .ev b{color:var(--navy)}
.fb .ev .k{color:var(--sub);font-size:14px;margin-left:26px;display:block}
.hintbox{margin-top:12px;padding:12px 14px;background:var(--mark);border-radius:6px;font-size:15px;line-height:1.7;display:none}
.hintbox.on{display:block}
.hintbox .k{display:block;color:var(--sub);font-size:14px;margin-left:26px}
.qnav .btn{padding:14px 30px;font-size:16px}
.dots i{width:12px;height:12px}
.prog{font-size:15px}
.sw{font-size:15px;padding:7px 16px}
.drawer{font-size:16px;max-height:320px}
.scorewrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-bottom:16px}
.scorecircle{width:124px;height:124px;border-radius:50%;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.scorecircle b{font-size:36px;line-height:1}
.scorecircle span{font-size:13px;opacity:.85;margin-top:5px}
.scoremsg{font-size:20px;font-weight:600}
.scoremsg small{display:block;font-size:15px;color:var(--sub);font-weight:400;margin-top:6px;line-height:1.6}
.allq{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:8px;margin:14px 0 22px}
.allq div{border:1.5px solid var(--line);border-radius:8px;padding:8px 4px;text-align:center;font-size:13px;cursor:pointer;color:var(--sub)}
.allq div b{display:block;font-size:18px;color:var(--ink)}
.allq div.ok{border-color:var(--ok);background:var(--ok-soft)}
.allq div.ok b{color:var(--ok)}
.allq div.no{border-color:var(--no);background:var(--no-soft)}
.allq div.no b{color:var(--no)}
.res{padding:16px 18px;margin:14px 0;border-radius:8px;border-left-width:5px;font-size:16px}
.res .qh{font-size:18px;font-weight:600;margin-bottom:10px;line-height:1.5}
.res .step{display:flex;gap:10px;align-items:flex-start;margin:8px 0;font-size:16px;line-height:1.6}
.res .step .tag{flex:none;min-width:92px;padding:3px 8px;border-radius:4px;font-size:13px;font-weight:600;text-align:center;margin-top:3px}
.tag.mine{background:var(--no-soft);color:var(--no)}
.tag.ans{background:var(--ok-soft);color:var(--ok)}
.tag.note{background:var(--navy-soft);color:var(--navy)}
.tag.src{background:var(--mark);color:#7a5a00}
.res .step .k{display:block;color:var(--sub);font-size:14px}
.h3{font-size:17px;font-weight:600;color:var(--navy);margin:20px 0 8px}
.weak{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.weak span{background:var(--no-soft);color:var(--no);padding:7px 14px;border-radius:20px;font-size:15px;font-weight:600}

/* ── v1.3 완성 노트 카드 ── */
.ncard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:26px 24px;margin-bottom:14px}
.ncard.cur{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy-soft)}
#sP2{position:sticky;top:52px;z-index:4;max-height:260px}
.ncard .kind{display:inline-block;font-size:17px;font-weight:700;color:var(--no);background:var(--no-soft);padding:6px 16px;border-radius:20px}
.ncard .qno{font-size:17px;color:var(--no);margin-left:12px;font-weight:700}
.ncard .stem{font-size:22px;font-weight:700;margin:14px 0 6px;line-height:1.5}
.ncard .stem .src{font-size:14px;font-weight:400;margin-left:10px}
.ncard .how{font-size:15px;color:var(--sub);margin-bottom:12px}
.ncard textarea{width:100%;min-height:90px;border:1.5px solid var(--line);border-radius:8px;padding:12px;font:inherit;font-size:17px;line-height:1.6;resize:vertical}
.reveal{display:none;margin-top:16px;padding:18px 20px;background:var(--ok-soft);border-radius:8px}
.reveal.on{display:block}
.reveal .rt{font-size:13px;font-weight:700;color:var(--ok);letter-spacing:.5px;margin:16px 0 6px}
.reveal .rt:first-child{margin-top:0}
.reveal .rm{font-size:20px;line-height:1.7;font-weight:600;color:var(--ink)}
.reveal .rd{font-size:16.5px;line-height:1.85;color:var(--ink)}
.reveal .rs{font-size:15px;line-height:1.7}
.reveal .rs .k{display:block;color:var(--sub);font-size:14px;margin-left:26px}
.vocab.big span{font-size:17px;padding:8px 14px}
.vocab.big span i{font-size:15px}
</style>
</head>
<body>
<header>
  <h1>독해 노트 → 문제</h1>
  <p>2026년 2학기 신목고1 중간고사 추가읽기 · “Talking” Baby Bats (2022 카이스트 기출)</p>
</header>
<nav>
  <button class="on" data-t="t3">① 문제 풀기</button>
  <button data-t="t4">② 결과</button>
  <button data-t="t2">③ 완성 노트</button>
</nav>
<main>

<!-- ③ 완성 노트 (전체 카드 한 페이지) -->
<section class="tab" id="t2">
  <div class="qbar">
    <div class="small" style="flex:1">카드의 항목명을 누르면 지문에서 근거 문장이 노랗게 표시됩니다. 「펼치기」로 모범 노트를 확인하세요.</div>
    <div class="switches">
      <button class="sw fill" id="bP2" onclick="toggleSide('sP2',this)">지문</button>
      <button class="sw" id="bK2" onclick="toggleKo('sP2');this.classList.toggle('fill')">해석</button>
      <button class="sw" onclick="revealAll(true)">전체 펼치기</button>
      <button class="sw" onclick="revealAll(false)">전체 접기</button>
    </div>
  </div>
  <div class="drawer side on passage" id="sP2"></div>
  <div id="ncards"></div>
</section>

<!-- ① 문제 풀기 -->
<section class="tab on" id="t3">
  <div class="qbar">
    <div class="prog"><span id="pnum"></span><div class="bar"><i id="pfill"></i></div></div>
    <div class="switches">
      <button class="sw fill" id="bP" onclick="toggleSide('sP',this)">지문</button>
      <button class="sw" id="bN" onclick="toggleSide('sN',this)">노트</button>
    </div>
  </div>
  <div class="drawer side on" id="sP"></div>
  <div class="drawer side" id="sN"></div>
  <div id="qs"></div>
  <div class="qnav">
    <button class="btn" id="bPrev" onclick="moveQ(-1)">이전</button>
    <div class="dots" id="dots"></div>
    <button class="btn fill" id="bNext" onclick="moveQ(1)">다음</button>
  </div>
</section>

<!-- ② 결과 -->
<section class="tab" id="t4">
  <div class="box" id="result"><p class="small">① 문제 풀기에서 채점하면 결과가 여기에 나타납니다.</p></div>
</section>

</main>
<script>
// ───────── 데이터 ─────────
const D={"S": ["Other than humans, a species of bats known as the “greater sac-winged bats” are the only mammals* to engage in infant “talk,” or babble**.", "About two inches long, the greater sac-winged bats are nocturnal, sleeping through much of the day and remaining awake at night.", "Though they live together in groups, they keep enough distance between themselves, which enables researchers to record separately the sounds each bat makes.", "This is crucial to researchers who study the babbling of these greater sac-winged bats.", "Recently, a group of researchers tried to analyze in detail the babbling behavior of these infant bats, also called bat pups, and to compare it with human infant babbling.", "Analyzing the recordings of 216 “babbling bursts,” which averaged about seven minutes but sometimes lasted as long as 43 minutes, of 20 bat pups from two bat communities in Costa Rica and Panama, the researchers found that the sounds the bat pups made were similar to those of human infants in their repetition of syllables***, the rhythmic nature of the babbling, and the universality of babbling behavior.", "Other similarities with the babbling of human infants included the early start of babbling, the long sequences of sounds, and the fact that the pups didn’t need any stimulus from other bats — like human babies, they just babbled on, gradually acquiring more sounds.", "Why do bat pups babble then?", "The researchers believe that babbling helps the bat pups prepare for and learn about the elements in courtship**** songs sung by adult bats.", "When the female pups learn through babbling the basic building blocks of a courtship song, for example, such knowledge later makes them better judges of male song when they have grown beyond their infancy.", "Adult males, on the other hand, compete intensely to attract females using their bat-song, the components of which they learned about in their infancy while babbling.", "Ultimately, the females choose which males they prefer, and the males constantly court**** them in a kind of talent competition.", "[Q3] It appears that such babbling practice may not only prepare bat pups for courtships, but also....", "Such common characteristics may yield valuable insights for better understanding the essential nature and development of vocal communication not only of humans but, ultimately, of non-human species as well."], "KO": ["인간 외에, ‘greater sac-winged bats(큰주머니날개박쥐)’라고 알려진 박쥐 한 종은 유아기 ‘말하기’, 즉 옹알이를 하는 유일한 포유류이다.", "길이가 약 2인치인 greater sac-winged bats는 야행성으로, 낮의 대부분을 자면서 보내고 밤에는 깨어 있다.", "그들은 무리를 지어 함께 살지만, 서로 충분한 거리를 유지하는데, 이것이 연구자들이 각 박쥐가 내는 소리를 따로따로 녹음할 수 있게 해 준다.", "이것은 이 greater sac-winged bats의 옹알이를 연구하는 연구자들에게 결정적으로 중요하다.", "최근에 한 연구진은 bat pups라고도 불리는 이 새끼 박쥐들의 옹알이 행동을 상세히 분석하고, 그것을 인간 아기의 옹알이와 비교하려고 했다.", "코스타리카와 파나마의 두 박쥐 군집 출신 새끼 박쥐 20마리의, 평균 약 7분이지만 때로는 43분까지도 이어진 216개의 ‘옹알이 분출(babbling bursts)’ 녹음을 분석하면서, 연구자들은 새끼 박쥐가 내는 소리가 음절의 반복, 옹알이의 리듬감 있는 성질, 옹알이 행동의 보편성에서 인간 아기의 소리와 비슷하다는 것을 발견했다.", "인간 아기의 옹알이와의 다른 유사점에는 옹알이의 이른 시작, 긴 소리의 연쇄, 그리고 새끼들이 다른 박쥐로부터 어떤 자극도 필요로 하지 않았다는 사실이 포함되었다 — 인간 아기처럼, 그들은 그저 계속 옹알이하며 점차 더 많은 소리를 습득했다.", "그렇다면 새끼 박쥐는 왜 옹알이를 할까?", "연구자들은 옹알이가 새끼 박쥐들이 성체 박쥐가 부르는 구애 노래의 요소들을 준비하고 배우는 데 도움이 된다고 믿는다.", "예를 들어 암컷 새끼들이 옹알이를 통해 구애 노래의 기본 구성 요소를 배우면, 그러한 지식은 나중에 그들이 유아기를 지나 자랐을 때 수컷 노래의 더 나은 판단자가 되게 해 준다.", "반면에 성체 수컷들은 자기의 박쥐 노래를 이용해 암컷을 끌어들이려고 치열하게 경쟁하는데, 그 노래의 구성 요소는 그들이 유아기에 옹알이하면서 배운 것이다.", "결국 암컷이 어느 수컷을 선호하는지 선택하고, 수컷은 일종의 재능 경연에서 끊임없이 암컷에게 구애한다.", "[Q3] 그러한 옹알이 연습은 새끼 박쥐를 구애에 대비시킬 뿐만 아니라, 또한 ….(빈칸 — 시험 문항)", "그러한 공통 특징들은 인간뿐 아니라 궁극적으로 비인간 종의 음성 소통의 본질적 성격과 발달을 더 잘 이해하기 위한 귀중한 통찰을 제공할 수 있다."], "NOTES": [{"id": "topic", "cat": "주제", "lab": "주제 / 요지", "model": "greater sac-winged bat 새끼의 옹알이는 인간 아기 옹알이와 매우 유사하며(반복·리듬·보편성 등), 구애 노래를 준비하는 기능을 하고, 음성 소통의 발달을 이해하는 통찰을 준다.", "src": [6, 9, 14], "detail": "글 전체가 ‘박쥐 새끼도 사람 아기처럼 옹알이한다’는 한 가지 사실을 중심으로 돌아간다. 앞부분은 그 유사점이 무엇인지(s6~7), 중간은 왜 옹알이하는지(s9~12), 끝은 그 연구가 왜 중요한지(s14)를 말한다. 주제 선택지를 고를 때는 ‘유사점 + 구애 준비 + 음성 소통 이해’가 모두 들어 있는 것을 찾는다. 수컷의 경쟁이나 야행성 같은 세부 내용은 주제가 아니다."}, {"id": "type", "cat": "글의 종류", "lab": "전개 방식", "model": "대상 소개(s1~4) → 연구 방법·결과(s5~7) → 질문과 답: 왜 옹알이하나(s8~12) → 의의(s13~14). 연구 보고형 설명문", "src": [1, 5, 8, 14], "detail": "설명문 중에서도 ‘연구 보고’ 구조다. ① 대상 소개 → ② 연구 방법·결과 → ③ Why? 질문 후 답 → ④ 연구의 의의. s8의 질문(Why do bat pups babble then?)이 글의 후반부를 여는 전환점이므로, 순서 배열 문제에서는 이 질문 앞뒤를 기준으로 나누면 쉽다."}, {"id": "d1", "cat": "세부정보 · 박쥐의 특징", "lab": "4가지 (s1~2)", "model": "① 인간 외에 유일하게 옹알이(babble)하는 포유류 ② 길이 약 2인치 ③ 야행성(nocturnal) — 낮에 자고 밤에 깸 ④ 이름: greater sac-winged bats", "src": [1, 2], "detail": "s1~2에 나열된 사실을 하나도 빠짐없이 적어 둔다. 시험에서는 이 중 하나만 살짝 바꿔 오답을 만든다(예: live alone, sleep at night). ‘Other than humans’(인간을 제외하고)와 ‘the only mammals’(유일한 포유류)를 묶어서 이해할 것. nocturnal의 뜻은 바로 뒤 분사구문(sleeping…, remaining…)이 풀어서 설명해 준다."}, {"id": "c1", "cat": "원인→결과", "lab": "거리 유지 → 개별 녹음", "model": "무리 지어 살지만(though) 서로 거리를 유지 → 연구자가 각 박쥐의 소리를 따로 녹음 가능 → 옹알이 연구에 결정적(crucial)", "src": [3, 4], "detail": "Though(양보) → 무리 생활 / 그러나 거리 유지 → which(앞 절 전체를 받음) → 개별 녹음 가능 → This(s4) = 그 사실 → crucial. 인과 고리가 세 단계로 이어진다. ‘무리 지어 살아서 녹음이 어렵다’로 뒤집는 오답에 주의."}, {"id": "a1", "cat": "행위 · 연구 목적", "lab": "2가지 (s5)", "model": "① 새끼 박쥐(bat pups)의 옹알이 행동을 상세히 분석 ② 인간 아기 옹알이와 비교", "src": [5], "detail": "tried to analyze … and to compare … : to부정사 두 개가 and로 병렬되어 연구 목적이 ‘분석’과 ‘비교’ 두 가지임을 보여 준다. ‘these infant bats, also called bat pups’에서 bat pups = 새끼 박쥐라는 용어 정의도 함께 기억한다."}, {"id": "d2", "cat": "세부정보 · 연구 데이터", "lab": "숫자 5개 (s6)", "model": "216개 babbling bursts / 평균 약 7분 / 최장 43분 / 새끼 박쥐 20마리 / 두 군집(Costa Rica, Panama)", "src": [6], "detail": "숫자가 다섯 개나 나오므로 각 숫자가 무엇의 수치인지 짝지어 둔다. 특히 ‘평균 7분 / 최장 43분’을 서로 바꿔 묻는 T/F가 단골이다. 216은 녹음(bursts)의 수이지 박쥐의 수(20)가 아니다. which averaged … but sometimes lasted … 는 216 bursts를 설명하는 관계절이다."}, {"id": "a2", "cat": "행위 · 인간 아기와의 유사점", "lab": "3가지 (s6)", "model": "① 음절 반복(repetition of syllables) ② 리듬감 있는 성질(rhythmic nature) ③ 옹알이 행동의 보편성(universality)", "src": [6], "detail": "‘similar to those of huma ", "model": "This = 각 박쥐의 소리를 따로 녹음할 수 있다는 것 / such knowledge = 옹알이로 배운 구애 노래의 기본 구성 요소 / Such common characteristics = 박쥐 옹알이와 인간 아기 옹알이의 공통 특징", "src": [4, 10, 14], "detail": "This(s4)는 바로 앞 문장 전체 내용을 받는다. such knowledge(s10)는 같은 문장 앞부분 ‘the basic building blocks of a courtship song’을 가리킨다. Such common characteristics(s14)는 s6~7에서 나열한 박쥐·인간 옹알이의 유사점 전체다. 지시어 문제는 ‘바로 앞에서 무엇을 말했나’를 찾으면 된다."}, {"id": "p2", "cat": "지시어", "lab": "them (s10), which (s11), them (s12)", "model": "them(s10) = the female pups / which(s11) = their bat-song(의 components) / them(s12) = the females", "src": [10, 11, 12], "detail": "them(s10)의 문장은 the female pups로 시작하므로 = 암컷 새끼. which(s11)는 ‘the components of which’로 their bat-song을 받는 관계대명사(그 노래의 구성 요소). them(s12)은 앞 절의 the females. 성별이 바뀌지 않았는지 확인한다."}], "VOCAB": [["mammal", "포유류"], ["babble", "옹알이(하다)"], ["nocturnal", "야행성의"], ["crucial", "결정적인"], ["burst", "분출, 폭발적 발생"], ["average", "평균 ~이다"], ["repetition", "반복"], ["syllable", "음절"], ["universality", "보편성"], ["stimulus", "자극"], ["acquire", "습득하다"], ["courtship", "구애"], ["court", "구애하다"], ["yield", "산출하다, 내다"], ["insight", "통찰"]], "Q": [{"type": "mc", "note": "topic", "stem": "이 글의 주제로 가장 적절한 것은?", "opts": ["how bats warn their group of danger at night", "bat pups’ babbling as a parallel to human infant babbling and a rehearsal for courtship songs", "why nocturnal animals develop more complex songs than others", "the fierce competition between male bats for territory", "key differences between bat babbling and human babbling"], "ans": 1}, {"type": "mc", "note": "d1", "stem": "greater sac-winged bats에 대한 설명으로 옳지 <u>않은</u> 것은?", "opts": ["They are the only mammals other than humans known to babble.", "They are about two inches long.", "They sleep through much of the day.", "They live alone, far away from other bats.", "They remain awake at night."], "ans": 3}, {"type": "tf", "note": "c1", "stem": "Because they live in groups, it is hard for researchers to record each bat’s sounds separately.", function initState(){Q.forEach((q,i)=>{if(q.type==='match')state[i]=q.left.map(()=>-1);else if(q.type==='order')state[i]=[];else if(q.type==='blank')state[i]=['','',''];else state[i]=undefined;if(q.type==='order')q._shuf=shuffle(q.items.map((_,k)=>k))})}
function answered(i){const s=state[i],q=Q[i];if(q.type==='match')return s.every(v=>v>=0);if(q.type==='order')return s.length===q.items.length;if(q.type==='blank')return s.every(v=>v);return s!==undefined}
function isOk(i){const s=state[i],q=Q[i];if(q.type==='mc')return s===q.ans;if(q.type==='tf')return s===(q.ans?1:0);if(q.type==='match')return s.every((v,k)=>v===q.ans[k]);if(q.type==='order')return s.length===q.ans.length&&s.every((v,k)=>v===q.ans[k]);return s.every((v,k)=>v===q.ans[k])}
function ansText(q){return q.type==='mc'?q.opts[q.ans]:q.type==='tf'?(q.ans?'True':'False')+(q.why?' — '+q.why:''):q.type==='match'?q.left.map((l,i)=>`${l} → ${q.right[q.ans[i]]}`).join(' / '):q.type==='order'?q.ans.map(i=>q.items[i]).join(' → '):q.ans.map((a,i)=>`(${'ABC'[i]}) ${a}`).join('  ')}
function mineText(i){const s=state[i],q=Q[i];if(!answered(i))return '(미응답)';if(q.type==='mc')return q.opts[s];if(q.type==='tf')return s?'True':'False';if(q.type==='match')return s.map((v,k)=>`${q.left[k]} → ${q.right[v]}`).join(' / ');if(q.type==='order')return s.map(k=>q.items[k]).join(' → ');return s.map((v,k)=>`(${'ABC'[k]}) ${v}`).join('  ')}

  $('#bPrev').disabled=cur===0;
  const last=cur===Q.length-1;$('#bNext').textContent=last?(graded?'결과 보기':'채점'):'다음';
  $('#dots').innerHTML=Q.map((_,i)=>`<i class="${i===cur?'cur ':''}${graded?(isOk(i)?'ok':'no'):(answered(i)?'done':'')}" onclick="goQ(${i})"></i>`).join('');
}
function pick(i){if(graded)return;state[cur]=i;renderQ()}
function pair(j){if(graded)return;const s=state[cur],a=s.indexOf(-1);if(a<0||s.includes(j))return;s[a]=j;renderQ()}
function unpair(i){state[cur][i]=-1;renderQ()}
function slot(i){if(graded)return;const s=state[cur];if(s.includes(i))return;s.push(i);renderQ()}
function unslot(i){if(graded)return;const s=state[cur];if(s[i]===undefined)return;s.splice(i);renderQ()}
function setBlank(i){if(graded)return;Q[cur]._act=i;renderQ()}
function fillBlank(w){if(graded)return;const q=Q[cur],s=state[cur];let i=q._act??s.indexOf('');if(i<0)return;s[i]=w;q._act=undefined;renderQ()}
function toggleHint(){Q[cur]._hint=!Q[cur]._hint;renderQ()}
function goQ(i){cur=i;renderQ()}
function moveQ(d){if(d>0&&cur===Q.length-1){if(graded)goTab('t4');else grade();return}cur=Math.max(0,Math.min(Q.length-1,cur+d));renderQ()}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function toggleSide(id,b){$('#'+id).classList.toggle('on');b.classList.toggle('fill')}
function resetQ(){graded=false;cur=0;initState();renderQ();$('#result').innerHTML='<p class="small">① 문제 풀기에서 채점하면 결과가 여기에 나타납니다.</p>'}

function grade(){
  const un=Q.map((_,i)=>i).filter(i=>!answered(i));
  if(un.length&&!confirm(`아직 안 푼 문항: ${un.map(i=>i+1).join(', ')}번\n그래도 채점할까요?`))return;
  graded=true;
  let score=0;const wrong=[];
  Q.forEach((q,i)=>{if(isOk(i))score++;else wrong.push(i)});
  const pct=Math.round(score/Q.length*100);
  const msg=pct===100?'완벽합니다!':pct>=80?'잘했어요. 틀린 문항만 다시 확인하세요.':pct>=60?'지문을 다시 읽고 놓친 노트를 채워 보세요.':'지문을 문장 단위로 다시 정리해야 합니다.';
  let h=`<div class="scorewrap"><div class="scorecircle"><b>${score}</b><span>/ ${Q.length}문항 · ${pct}%</span></div>
    <div class="scoremsg">${msg}<small>아래에서 <b>틀린 문항 → 놓친 노트 → 근거 문장(해석)</b> 순으로 되짚어 봅니다.<br>문항 번호를 누르면 해당 문제로 돌아갑니다.</small></div></div>`;
  h+=`<div class="allq">`+Q.map((q,i)=>`<div class="${isOk(i)?'ok':'no'}" onclick="goTab('t3');goQ(${i})"><b>${i+1}</b>${isOk(i)?'정답':'오답'}</div>`).join('')+`</div>`;
  if(wrong.length){
    const missed={};wrong.forEach(i=>{const c=noteById(Q[i].note).cat.split(' ·')[0];missed[c]=(missed[c]||0)+1});
    h+=`<div class="h3">취약 유형</div><div class="weak">${Object.entries(missed).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<span>${k} ${v}문항</span>`).join('')}</div>`;
    h+=`<div class="h3">틀린 문항 다시 보기</div>`;
    wrong.forEach(i=>{const q=Q[i],n=noteById(q.note);
      h+=`<div class="res"><div class="qh">${i+1}. ${q.stem}</div>
      <div class="step"><span class="tag mine">내 답</span><span>${mineText(i)}</span></div>
      <div class="step"><span class="tag ans">정답</span><span>${ansText(q)}</span></div>
      <div class="step"><span class="tag note">놓친 노트</span><span>[${n.cat} · ${n.lab}]<br>${n.model}</span></div>
      <div class="step"><span class="tag src">근거 문장</span><span>${n.src.map(k=>`<b>s${k}</b> ${S[k-1]}<span class="k">${KO[k-1]}</span>`).join('')}</span></div></div>`});
  }
  h+=`<div class="tools" style="margin-top:18px"><button class="btn" style="font-size:15px;padding:12px 20px" onclick="goTab('t3');goQ(0)">해설 보며 다시 보기</button><button class="btn fill" style="font-size:15px;padding:12px 20px" onclick="resetQ();goTab('t3')">처음부터 다시 풀기</button></div>`;
  $('#result').innerHTML=h;
  goTab('t4');
}

// 탭
function goTab(id){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===id));document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.id===id));window.scrollTo(0,0)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>goTab(b.dataset.t));

renderPassage($('#sP2'),false);renderNotesPage();
renderPassage($('#sP'),false);renderNotes($('#sN'));
initState();renderQ();
</script>
</body>
</html>
